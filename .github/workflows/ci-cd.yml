# Pipeline de CI/CD do DocumentAI.
#
# Build e Test executam a compilação e os testes reais da solution.
# Deploy ainda é um esqueleto: apenas imprime mensagens e não altera nenhum recurso do Azure.
# A evolução segue as tarefas 10.3 e 10.4 de docs/tasks.md e a skill .agents/skills/azure-deployment.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: cada job só recebe permissões adicionais quando precisar.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DocumentAI.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION }}

      # A suíte QualidadeIA usa a OpenAI real e roda só sob demanda (architecture.md, seção 8.5).
      - name: Executar os testes
        run: >-
          dotnet test ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --filter "Categoria!=QualidadeIA"
          --logger trx
          --results-directory TestResults

      - name: Publicar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults/*.trx
          if-no-files-found: warn

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Publica apenas em push na main; nunca em pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Futuramente: environment "production" com revisores obrigatórios
    # e "id-token: write" para autenticação no Azure via OIDC.
    steps:
      - name: Deploy (placeholder)
        run: |
          echo "Deploy: etapa de teste do pipeline. Nenhum recurso do Azure é alterado."
          echo "Futuramente: azure/login via OIDC, publicação no Azure App Service e verificação de GET /health."
