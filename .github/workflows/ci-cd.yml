# Pipeline de CI/CD do DocumentAI (skill .agents/skills/azure-deployment).
#
#   Build  -> restaura, compila e gera o pacote de publicação da API.
#   Test   -> executa os testes automatizados; se falharem, não há deploy.
#   Deploy -> publica no Azure App Service via OIDC, com aprovação manual (environment "production"),
#             e valida a aplicação publicada.
#
# Configuração no environment "production" do GitHub (sem nenhuma senha ou chave):
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variável  AZURE_WEBAPP_NAME
# Recursos do Azure: infra/provisionar-azure.ps1.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: cada job só recebe permissões adicionais quando precisar.
permissions:
  contents: read

# Execuções de pull request são canceladas por novas; deploys nunca são interrompidos no meio.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DocumentAI.sln
  PROJETO_API: src/DocumentAI.API/DocumentAI.API.csproj
  CONFIGURATION: Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compilar
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Gerar o pacote de publicação da API
        run: dotnet publish ${{ env.PROJETO_API }} --configuration ${{ env.CONFIGURATION }} --no-build --output publish

      - name: Guardar o pacote de publicação
        uses: actions/upload-artifact@v4
        with:
          name: api-publicacao
          path: publish
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION }}

      # A suíte QualidadeIA usa a OpenAI real e roda só sob demanda (architecture.md, seção 8.5).
      - name: Executar os testes
        run: >-
          dotnet test ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --filter "Categoria!=QualidadeIA"
          --logger trx
          --results-directory TestResults

      - name: Publicar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults/*.trx
          if-no-files-found: warn

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Só publica se o build e os testes passaram.
    needs: [build, test]
    # Só publica a partir da main (push ou disparo manual); nunca em pull requests.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Revisores obrigatórios do environment aprovam cada publicação.
    environment:
      name: production
      url: ${{ steps.publicar.outputs.webapp-url }}/scalar
    permissions:
      contents: read
      id-token: write # token OIDC para o login federado no Azure
    steps:
      - name: Baixar o pacote de publicação
        uses: actions/download-artifact@v4
        with:
          name: api-publicacao
          path: publish

      - name: Login no Azure (OIDC, sem segredo de longa duração)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar no Azure App Service
        id: publicar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      # O plano gratuito (F1) desliga a aplicação quando ociosa: a primeira resposta pode demorar.
      # Enquanto o endpoint /health não existir (tarefa 6.3), a validação usa o OpenAPI e o Scalar.
      - name: Validar a aplicação publicada
        env:
          URL_APP: ${{ steps.publicar.outputs.webapp-url }}
        run: |
          validar() {
            local caminho="$1"
            for tentativa in $(seq 1 18); do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$URL_APP$caminho" || true)
              if [ "$status" = "200" ]; then
                echo "OK  $caminho -> $status"
                return 0
              fi
              echo "Aguardando $caminho (tentativa $tentativa/18, status $status)..."
              sleep 10
            done
            echo "::error title=Validação pós-deploy::$caminho não respondeu 200."
            return 1
          }
          validar /openapi/v1.json
          validar /scalar
          {
            echo "### Deploy concluído"
            echo ""
            echo "- Aplicação: $URL_APP"
            echo "- Documentação (Scalar): $URL_APP/scalar"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Orientar o rollback
        if: failure()
        run: |
          {
            echo "### Falha no deploy"
            echo ""
            echo "A aplicação publicada não passou na validação ou a publicação falhou."
            echo "Para voltar à versão anterior: abra a última execução bem-sucedida deste workflow"
            echo "e use **Re-run jobs** no job Deploy, ou reverta o commit na main."
            echo "Logs: Azure Portal > App Service > Log stream."
          } >> "$GITHUB_STEP_SUMMARY"
